name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Validate version
        shell: zsh {0}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_NAME" == v<->.<->.<-> ]]
          plist_version="$(plutil -extract CFBundleShortVersionString raw Resources/SimLease-Info.plist)"
          [[ "$version" == "$plist_version" ]]

      - name: Run tests
        shell: zsh {0}
        run: |
          set -euo pipefail
          swift test
          scripts/package-app.sh
          zsh Tests/InstallationTests/install-app.zsh
          zsh Tests/InstallationTests/install-release.zsh

      - name: Package unsigned release
        shell: zsh {0}
        run: |
          set -euo pipefail
          zsh Tests/InstallationTests/package-release.zsh
